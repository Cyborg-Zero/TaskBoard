<!DOCTYPE html>
<html>
    <head>
        <title>TaskBoard</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="CyborgZero">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>TaskBoard</h1>
        </header>
        <div class="liste">
            <div class="suche">
                <input type="text" id="suche" oninput="Suchen()" placeholder="Suche nach Tickets" title="Tippe ein Suchbegriff ein" size="50">
                <input type="button" id="erstellen" value="Ticket erstellen">
            </div>
            <table id="tabelle">
                <tr class="header">
                    <th class="tid">ID</th>
                    <th class="titel">Titel</th>
                    <th class="desc">Beschreibung</th>
                    <th class="prio">Priorität</th>
                    <th class="date">Datum</th>
                </tr>
                <tr>
                    <td class="tid">01</td>
                    <td class="titel">Login-Bug</td>
                    <td class="desc">Login-Button geht nicht</td>
                    <td class="prio">Hoch</td>
                    <td class="date">12.03.2025</td>
                </tr>
                <tr>
                    <td class="tid">02</td>
                    <td class="titel">Übersicht ist falsch</td>
                    <td class="desc">CSS wird nicht geladen</td>
                    <td class="prio">Mittel</td>
                    <td class="date">25.03.2025</td>
                </tr>
                <tr>
                    <td class="tid">03</td>
                    <td class="titel">Zu langsam</td>
                    <td class="desc">Seite lädt sehr langsam</td>
                    <td class="prio">Niedrig</td>
                    <td class="date">04.04.2025</td>
                </tr>
            </table>
            <script src="suche.js"></script>
        </div>
    </body>
</html>
